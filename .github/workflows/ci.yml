name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
          - os: macos
    name: check (${{ matrix.os }})
    # Runners come from the repository's variables (LINUX_RUNNER, MACOS_RUNNER); without them the
    # jobs run on GitHub's runners, and only when HOSTED_CI is "true".
    if: ${{ vars.LINUX_RUNNER != '' || vars.HOSTED_CI == 'true' }}
    runs-on: ${{ matrix.os == 'linux' && (vars.LINUX_RUNNER || 'ubuntu-24.04') || (vars.MACOS_RUNNER || 'macos-14') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          PKGS="libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev pkg-config"
          dpkg -s $PKGS >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y $PKGS; }
      - run: tools/ci-target-cache.sh
        if: runner.environment != 'github-hosted'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Rust toolchain on the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup show
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
