[workspace]
members = ["crates/core", "crates/formats", "crates/preview", "crates/winpreview", "crates/cli", "src-tauri"]
# Coverage-guided fuzzing needs nightly Rust: `cargo +nightly fuzz run trees` in `fuzz/`.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/mlaib/isolinear"

[workspace.dependencies]
isolinear-core = { path = "crates/core" }
isolinear-formats = { path = "crates/formats" }
isolinear-preview = { path = "crates/preview" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
