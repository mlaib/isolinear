[package]
name = "isolinear-preview"
description = "Self-contained HTML previews for the file managers' quick previews (Quick Look, Explorer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# A static library for the macOS Quick Look extension; the Windows preview handler links it as Rust.
crate-type = ["rlib", "staticlib"]

[dependencies]
isolinear-core = { workspace = true }
isolinear-formats = { workspace = true }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
